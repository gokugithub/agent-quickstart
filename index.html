<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #697386;
      --line: #e5e9f0;
      --surface: #ffffff;
      --background: #f4f7fb;
      --accent: #5b5ce2;
      --accent-dark: #4546c6;
      --danger: #c2415d;
      --shadow: 0 18px 55px rgba(30, 45, 80, 0.1);
    }

    :root[data-theme="dark"] {
      --ink: #e5e9f0;
      --muted: #a0a8b8;
      --line: #2a3647;
      --surface: #1a2332;
      --background: #0f1419;
      --accent: #7b7dff;
      --accent-dark: #6364d4;
      --danger: #ff5a7a;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(116, 121, 239, 0.16), transparent 34rem),
        var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(100% - 2rem, 720px);
      margin: 0 auto;
      padding: 4.5rem 0 3rem;
    }

    .header { 
      margin-bottom: 1.75rem; 
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .header-content { flex: 1; }
    .eyebrow {
      margin: 0 0 .5rem;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      letter-spacing: -.055em;
      line-height: 1;
    }
    .subtitle {
      margin: .8rem 0 0;
      font-size: 1.05rem;
      font-family: cursive;
      background: linear-gradient(135deg, #5b5ce2, #c2415d);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel {
      padding: clamp(1rem, 3vw, 1.5rem);
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(229, 233, 240, .9);
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
    }

    .add-form { display: flex; gap: .7rem; }
    .task-input {
      min-width: 0;
      flex: 1;
      padding: .9rem 1rem;
      color: var(--ink);
      background: #f8f9fc;
      border: 1px solid var(--line);
      border-radius: .7rem;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 92, 226, .14);
    }
    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      color: var(--muted);
      background: rgba(255, 255, 255, .6);
      border-radius: 50%;
      font-size: 1.1rem;
      transition: background .2s, color .2s;
    }
    :root[data-theme="dark"] .theme-toggle {
      background: rgba(26, 35, 50, .6);
    }
    .theme-toggle:hover {
      color: var(--accent);
      background: rgba(91, 92, 226, .1);
    }
    .theme-toggle:active {
      transform: scale(0.95);
    }
    .add-button {
      padding: 0 1.25rem;
      color: white;
      background: var(--accent);
      border-radius: .7rem;
      font-weight: 700;
      transition: background .2s, transform .2s;
    }
    .add-button:hover { background: var(--accent-dark); }
    .add-button:active { transform: translateY(1px); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 1.5rem 0 1rem;
    }
    .summary { color: var(--muted); font-size: .9rem; }
    .clear-button {
      padding: .4rem .65rem;
      color: var(--muted);
      background: transparent;
      border-radius: .45rem;
      font-size: .85rem;
    }
    .clear-button:hover { color: var(--danger); background: #fff1f3; }

    .task-list { list-style: none; padding: 0; margin: 0; }
    .task {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: 1rem 0;
      border-top: 1px solid var(--line);
    }
    .task:first-child { border-top: 0; }
    .check {
      display: grid;
      width: 1.3rem;
      height: 1.3rem;
      flex: 0 0 1.3rem;
      place-items: center;
      color: transparent;
      background: transparent;
      border: 2px solid #cbd2df;
      border-radius: 50%;
      font-size: .75rem;
      font-weight: 900;
      transition: .2s;
    }
    .check:hover { border-color: var(--accent); }
    .task.completed .check {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }
    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }
    .task.completed .task-text { color: #9aa3b2; text-decoration: line-through; }
    .delete-button {
      padding: .4rem .55rem;
      color: #a2aaba;
      background: transparent;
      border-radius: .4rem;
      font-size: 1.15rem;
      line-height: 1;
    }
    .delete-button:hover { color: var(--danger); background: #fff1f3; }
    .empty {
      padding: 2.25rem 1rem 1.5rem;
      color: var(--muted);
      text-align: center;
    }
    .empty strong { display: block; margin-bottom: .35rem; color: var(--ink); }

    @media (max-width: 480px) {
      .app { padding-top: 2.5rem; }
      .add-form { flex-direction: column; }
      .add-button { min-height: 3rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-content">
        <p class="eyebrow">Your day, organized</p>
        <h1>Task list</h1>
        <p class="subtitle">Capture what matters and keep moving forward.</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
    </header>

    <section class="panel" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading" hidden>Your tasks</h2>
      <form class="add-form" id="add-form">
        <label for="task-input" hidden>New task</label>
        <input class="task-input" id="task-input" type="text" maxlength="200"
          placeholder="What needs to be done?" autocomplete="off">
        <button class="add-button" type="submit">Add task</button>
      </form>
      <div class="toolbar">
        <span class="summary" id="summary" aria-live="polite"></span>
        <button class="clear-button" id="clear-button" type="button">Clear completed</button>
      </div>
      <ul class="task-list" id="task-list"></ul>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "task-list-items";
      const form = document.getElementById("add-form");
      const input = document.getElementById("task-input");
      const list = document.getElementById("task-list");
      const summary = document.getElementById("summary");
      const clearButton = document.getElementById("clear-button");
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved) ? saved.filter(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          ) : [];
        } catch (error) {
          console.error("Could not load saved tasks.", error);
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function render() {
        list.replaceChildren();
        const remaining = tasks.filter(task => !task.completed).length;
        summary.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} remaining`;
        clearButton.hidden = !tasks.some(task => task.completed);

        if (tasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.innerHTML = "<strong>Nothing on your list yet</strong>Add a task above to get started.";
          list.append(empty);
          return;
        }

        tasks.forEach(task => {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " completed" : ""}`;

          const check = document.createElement("button");
          check.className = "check";
          check.type = "button";
          check.setAttribute("aria-label", task.completed ? `Mark "${task.text}" incomplete` : `Complete "${task.text}"`);
          check.textContent = "✓";
          check.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete "${task.text}"`);
          remove.textContent = "×";
          remove.addEventListener("click", () => {
            tasks = tasks.filter(itemTask => itemTask.id !== task.id);
            saveTasks();
            render();
          });

          item.append(check, text, remove);
          list.append(item);
        });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, text, completed: false });
        saveTasks();
        render();
        form.reset();
        input.focus();
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      render();
    })();

    // Theme switcher
    (() => {
      const THEME_KEY = "task-list-theme";
      const themeToggle = document.getElementById("theme-toggle");
      const html = document.documentElement;

      function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme || (prefersDark ? "dark" : "light");
        setTheme(theme);
      }

      function setTheme(theme) {
        if (theme === "dark") {
          html.setAttribute("data-theme", "dark");
          themeToggle.textContent = "☀️";
          themeToggle.setAttribute("aria-label", "Toggle light mode");
        } else {
          html.removeAttribute("data-theme");
          themeToggle.textContent = "🌙";
          themeToggle.setAttribute("aria-label", "Toggle dark mode");
        }
        localStorage.setItem(THEME_KEY, theme);
      }

      function toggleTheme() {
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        setTheme(newTheme);
      }

      themeToggle.addEventListener("click", toggleTheme);
      initTheme();
    })();
  </script>
</body>
</html>
